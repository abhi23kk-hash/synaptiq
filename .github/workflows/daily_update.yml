
name: Human-Like Research Bot

on:
  schedule:
    # Morning: 8:00 AM IST
    - cron: '30 2 * * *'

    # Afternoon: 2:00 PM IST
    - cron: '30 8 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf google-genai

      - name: Configure Git Identity
        run: |
          git config user.name "Abhishek K"
          git config user.email "abhi23kk@gmail.com"

      - name: Run Research Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python research.py

      - name: Commit research updates
        run: |
          git add papers/ run_log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update daily AI research archive"
            git push
          else
            echo "No new research updates to commit."
          fi
